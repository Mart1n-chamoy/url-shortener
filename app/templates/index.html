<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🚀 URL Shortener</h1>
        <p>Acorta enlaces y consulta estadísticas</p>
    </header>

    <div class="card">

        <h2>Crear URL corta</h2>

        <input
            type="text"
            id="url"
            placeholder="https://ejemplo.com"
        >

        <input
            type="text"
            id="custom_code"
            placeholder="Código personalizado (opcional)"
        >

        <button onclick="shortenUrl()">
            Acortar URL
        </button>

        <div id="result"></div>

    </div>

    <div class="card">

        <h2>Consultar estadísticas</h2>

        <input
            type="text"
            id="stats_code"
            placeholder="Código corto"
        >

        <button onclick="getStats()">
            Ver estadísticas
        </button>

        <div id="stats"></div>

    </div>

    <footer>
        <p>
            FastAPI • SQLite • SQLAlchemy • Docker
        </p>
    </footer>

</div>

<script src="/static/app.js"></script>

</body>
</html>
