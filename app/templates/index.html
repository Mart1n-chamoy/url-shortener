<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>URL Shortener 🚀</h1>

    <input
        type="text"
        id="url"
        placeholder="https://ejemplo.com"
    >

    <input
        type="text"
        id="custom_code"
        placeholder="Código personalizado (opcional)"
    >

    <button onclick="shortenUrl()">
        Acortar URL
    </button>

    <div id="result"></div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
